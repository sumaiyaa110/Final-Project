services:
  - type: web
    name: anomalyx-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      # Comma-separated frontend origins allowed by CORS
      - key: ALLOWED_ORIGINS
        sync: false
